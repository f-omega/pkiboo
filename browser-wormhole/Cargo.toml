[package]
name = "pkiboo-browser-wormhole"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.56"
js-sys = "0.3.83"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.149"
web-sys = { version = "0.3.83", features = ["WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent"] }
magic-wormhole = { version = "0.8.1", default-features = false, features = ["transfer"] }
