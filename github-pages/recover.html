<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Send a paper share to pkiboo</title>
  <link rel="stylesheet" href="recover.css">
</head>
<body>
  <main>
    <p class="eyebrow">pkiboo recovery</p>
    <h1>Send a paper-share image</h1>
    <p>This page uses Magic Wormhole to authenticate a WebRTC data channel to the waiting pkiboo ceremony.</p>
    <section id="ready" hidden>
      <label class="picker">
        <span>Add or photograph paper-share images</span>
        <input id="image" type="file" accept="image/*" capture="environment" multiple>
      </label>
      <p id="selection">No images selected yet.</p>
      <button id="send" type="button" disabled>Send selected images</button>
      <p class="code">Wormhole <strong id="code"></strong></p>
    </section>
    <section id="transfer" hidden>
      <p id="filename"></p>
      <progress id="progress" max="100" value="0"></progress>
    </section>
    <p id="status" role="status">Loading the secure sender…</p>
    <p class="privacy">The image is encrypted in this browser. GitHub Pages and the transit bridge cannot read it.</p>
  </main>
  <script type="module" src="recover.js"></script>
</body>
</html>
