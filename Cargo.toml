[package]
name = "pkiboo"
version = "0.1.0"
edition = "2024"

[features]
default = ["wormhole"]
wormhole = ["dep:magic-wormhole", "dep:webrtc"]

[dependencies]
anstyle = "1.0.14"
async-trait = "0.1.92"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = "8.0.0"
futures = "0.3.34"
indicatif = "0.18.6"
image = "0.25.10"
itertools = "0.15.0"
libc = "0.2.189"
openssl = "0.10.81"
os_pipe = "1.2.3"
petname = "3.1.0"
p256 = "0.13.2"
printpdf = { version = "0.12.6", default-features = false }
procfs = "0.18.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
qrcode = { version = "0.14.1", default-features = false }
resolve-path = "0.1.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
vsss-rs = "5.4.0"
tokio = { version = "1.53.1", features = ["bytes", "fs", "macros", "net", "process", "rt-multi-thread", "signal"] }
tokio-udev = "0.10.0"
tokio-util = "0.7.19"
udev = { version = "0.9.3", features = ["send"] }
yaml_serde = "0.10.7"
zbus = { version = "5.19.0", features = ["tokio"] }
bson = { version = "3.1.0", features = ["serde"] }
serde_bytes = "0.11.19"
serde_json = "1.0.149"
magic-wormhole = { version = "0.8.1", optional = true }
webrtc = { version = "0.20.3", optional = true }
zbar-rust = "0.0.24"
