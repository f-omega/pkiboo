[package]
name = "fomega"
version = "0.1.0"
edition = "2024"

[dependencies]
anstyle = "1.0.14"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
indicatif = "0.18.6"
openssl = "0.10.81"
procfs = "0.18.0"
resolve-path = "0.1.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
udev = "0.9.3"
yaml_serde = "0.10.7"
