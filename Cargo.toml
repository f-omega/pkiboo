[package]
name = "fomega"
version = "0.1.0"
edition = "2024"

[dependencies]
anstyle = "1.0.14"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = "8.0.0"
futures = "0.3.34"
indicatif = "0.18.6"
itertools = "0.15.0"
libc = "0.2.189"
openssl = "0.10.81"
os_pipe = "1.2.3"
procfs = "0.18.0"
resolve-path = "0.1.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["bytes", "fs", "macros", "net", "process", "rt-multi-thread"] }
tokio-udev = "0.10.0"
udev = { version = "0.9.3", features = ["send"] }
yaml_serde = "0.10.7"
zbus = { version = "5.19.0", features = ["tokio"] }
