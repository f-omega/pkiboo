name: Build browser Wormhole adapter

on:
  push:
    paths:
      - "browser-wormhole/**"
      - ".github/workflows/browser-wormhole.yml"
  pull_request:
    paths:
      - "browser-wormhole/**"
      - ".github/workflows/browser-wormhole.yml"

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.106 --locked
      - run: cargo build --manifest-path browser-wormhole/Cargo.toml --target wasm32-unknown-unknown --release
      - run: wasm-bindgen browser-wormhole/target/wasm32-unknown-unknown/release/pkiboo_browser_wormhole.wasm --target web --out-dir github-pages/wormhole
      - uses: actions/upload-artifact@v4
        with:
          name: browser-wormhole
          path: github-pages/wormhole
