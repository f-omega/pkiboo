name: Deploy recovery page

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - "browser-wormhole/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install WASM toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.106 --locked
      - name: Build browser Wormhole adapter
        run: |
          cargo build --manifest-path browser-wormhole/Cargo.toml --target wasm32-unknown-unknown --release
          wasm-bindgen browser-wormhole/target/wasm32-unknown-unknown/release/pkiboo_browser_wormhole.wasm --target web --out-dir github-pages/wormhole
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
